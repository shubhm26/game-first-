<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Street Fighter 2D Arcade</title>
  <meta name="description" content="Retro 2D arcade fighting game with dynamic hitboxes, AI opponent, responsive mobile controls, and synthesized audio.">
  <meta property="og:title" content="Street Fighter 2D Arcade">
  <meta property="og:description" content="Retro 2D arcade fighting game with dynamic hitboxes, AI opponent, responsive mobile controls, and synthesized audio.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root {
      --bg-dark: #0a0c14;
      --panel-bg: rgba(18, 22, 36, 0.85);
      --accent-blue: #00d2ff;
      --accent-red: #ff3366;
      --accent-yellow: #ffb703;
      --text-main: #f0f4f8;
      --text-muted: #8b9bb4;
      --border-subtle: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 20%, #161b2e 0%, #080a10 100%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
      padding: 10px;
    }

    /* Header Bar */
    header {
      width: 100%;
      max-width: 860px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      padding: 0 4px;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #00d2ff 0%, #ffb703 50%, #ff3366 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-pill {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }

    .btn-pill:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn-pill.active {
      background: rgba(0, 210, 255, 0.2);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    /* Game Stage Container */
    #game-wrapper {
      position: relative;
      width: 100%;
      max-width: 860px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    /* Overlay Screens */
    .overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 10, 18, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 20px;
      text-align: center;
    }

    .overlay-screen.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .match-result-title {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
      text-shadow: 0 0 20px rgba(255, 51, 102, 0.6);
    }

    .match-result-title.p1-win {
      color: #00d2ff;
      text-shadow: 0 0 24px rgba(0, 210, 255, 0.8);
    }

    .match-result-title.cpu-win {
      color: #ff3366;
      text-shadow: 0 0 24px rgba(255, 51, 102, 0.8);
    }

    .match-result-title.draw {
      color: #ffb703;
      text-shadow: 0 0 24px rgba(255, 183, 3, 0.8);
    }

    .match-stats {
      display: flex;
      gap: 20px;
      margin: 16px 0 24px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      padding: 8px 16px;
      border-radius: 6px;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
    }

    .btn-restart {
      background: linear-gradient(135deg, #ff3366 0%, #ff5e3a 100%);
      color: #fff;
      border: none;
      font-size: 1.1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 12px 32px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 51, 102, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-restart:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 51, 102, 0.6);
    }

    .btn-restart:active {
      transform: translateY(1px);
    }

    .restart-hint {
      margin-top: 12px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Controls Bar & Mobile Touch Deck */
    .footer-bar {
      width: 100%;
      max-width: 860px;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .desktop-keybinds {
      background: var(--panel-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 8px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .key-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .kbd {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-family: inherit;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
    }

    /* On-Screen Mobile Virtual Controls */
    #mobile-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 6px 4px;
      touch-action: none;
    }

    .dpad-cluster {
      display: grid;
      grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(3, 48px);
      gap: 4px;
    }

    .action-cluster {
      display: grid;
      grid-template-columns: repeat(2, 60px);
      grid-template-rows: repeat(2, 54px);
      gap: 8px;
    }

    .touch-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      cursor: pointer;
      touch-action: none;
      transition: background 0.1s, transform 0.1s;
    }

    .touch-btn:active, .touch-btn.pressed {
      background: rgba(0, 210, 255, 0.35);
      border-color: var(--accent-blue);
      transform: scale(0.94);
    }

    .touch-btn.btn-punch {
      background: rgba(0, 210, 255, 0.18);
      border-color: rgba(0, 210, 255, 0.4);
    }
    .touch-btn.btn-punch:active, .touch-btn.btn-punch.pressed {
      background: rgba(0, 210, 255, 0.5);
    }

    .touch-btn.btn-kick {
      background: rgba(255, 51, 102, 0.18);
      border-color: rgba(255, 51, 102, 0.4);
    }
    .touch-btn.btn-kick:active, .touch-btn.btn-kick.pressed {
      background: rgba(255, 51, 102, 0.5);
    }

    .touch-btn.btn-block {
      background: rgba(255, 183, 3, 0.18);
      border-color: rgba(255, 183, 3, 0.4);
    }
    .touch-btn.btn-block:active, .touch-btn.btn-block.pressed {
      background: rgba(255, 183, 3, 0.5);
    }

    .dpad-empty {
      pointer-events: none;
      visibility: hidden;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 20px;
      background: #1e2538;
      border: 1px solid var(--border-subtle);
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.8rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s ease;
      pointer-events: none;
      z-index: 100;
    }
    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 640px) {
      body {
        padding: 4px;
        justify-content: flex-start;
      }
      .desktop-keybinds {
        display: none;
      }
      .brand-title {
        font-size: 0.95rem;
      }
      .btn-pill {
        padding: 4px 8px;
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>

  <!-- Top Header Bar -->
  <header>
    <div class="brand-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:#ff3366"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      <span>STREET FIGHTER 2D</span>
    </div>
    <div class="top-actions">
      <button id="toggle-hitboxes" class="btn-pill" title="Toggle active Hitbox & Hurtbox rendering">
        <span>Hitboxes</span>
        <span id="hitbox-status" style="color: #8b9bb4">OFF</span>
      </button>
      <button id="toggle-sound" class="btn-pill" title="Mute/Unmute Audio">
        <svg id="sound-icon-on" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
        <span id="sound-status">FX ON</span>
      </button>
      <button id="copy-html-btn" class="btn-pill" title="Copy standalone HTML code">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        <span>Copy HTML</span>
      </button>
    </div>
  </header>

  <!-- Main Game Frame -->
  <div id="game-wrapper">
    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <!-- Game Over / Victory Modal Overlay -->
    <div id="game-over-overlay" class="overlay-screen">
      <div id="result-badge" class="match-result-title p1-win">PLAYER 1 WINS</div>
      <p id="result-subtitle" style="font-size: 0.95rem; color: #cbd5e1; margin-bottom: 8px;">PERFECT K.O. VICTORY</p>
      
      <div class="match-stats">
        <div class="stat-item">
          <span>Damage Dealt</span>
          <span id="stat-p1-damage" class="stat-value">100</span>
        </div>
        <div class="stat-item">
          <span>Hits Landed</span>
          <span id="stat-p1-hits" class="stat-value">8</span>
        </div>
        <div class="stat-item">
          <span>Max Combo</span>
          <span id="stat-p1-combo" class="stat-value">3</span>
        </div>
        <div class="stat-item">
          <span>Attacks Blocked</span>
          <span id="stat-p1-blocks" class="stat-value">4</span>
        </div>
      </div>

      <button id="btn-restart" class="btn-restart">REMATCH</button>
      <span class="restart-hint">Press [SPACE] or [ENTER] to Restart</span>
    </div>
  </div>

  <!-- Bottom Controls Deck -->
  <div class="footer-bar">
    <!-- Desktop Keyboard Guide -->
    <div class="desktop-keybinds">
      <div class="key-group">
        <span style="color:var(--text-main); font-weight:600; margin-right:4px;">Move:</span>
        <span class="kbd">A</span><span class="kbd">D</span> or <span class="kbd">←</span><span class="kbd">→</span>
      </div>
      <div class="key-group">
        <span style="color:var(--text-main); font-weight:600; margin-right:4px;">Jump:</span>
        <span class="kbd">W</span> or <span class="kbd">↑</span>
      </div>
      <div class="key-group">
        <span style="color:var(--accent-yellow); font-weight:600; margin-right:4px;">Crouch / Block (-80% DMG):</span>
        <span class="kbd">S</span> or <span class="kbd">↓</span>
      </div>
      <div class="key-group">
        <span style="color:var(--accent-blue); font-weight:600; margin-right:4px;">Light Punch:</span>
        <span class="kbd">J</span> or <span class="kbd">1</span>
      </div>
      <div class="key-group">
        <span style="color:var(--accent-red); font-weight:600; margin-right:4px;">Heavy Kick:</span>
        <span class="kbd">K</span> or <span class="kbd">2</span>
      </div>
      <div class="key-group">
        <span style="color:var(--text-muted); margin-right:4px;">Debug:</span>
        <span class="kbd">H</span> (Hitboxes)
      </div>
    </div>

    <!-- Responsive On-Screen Mobile Touch Deck -->
    <div id="mobile-controls">
      <!-- Left D-Pad -->
      <div class="dpad-cluster">
        <div class="dpad-empty"></div>
        <button class="touch-btn" id="touch-up" data-key="KeyW">▲<br><span style="font-size:8px">JUMP</span></button>
        <div class="dpad-empty"></div>
        <button class="touch-btn" id="touch-left" data-key="KeyA">◄</button>
        <button class="touch-btn btn-block" id="touch-down" data-key="KeyS">▼<br><span style="font-size:8px">BLOCK</span></button>
        <button class="touch-btn" id="touch-right" data-key="KeyD">►</button>
        <div class="dpad-empty"></div>
        <div class="dpad-empty"></div>
        <div class="dpad-empty"></div>
      </div>

      <!-- Right Action Cluster -->
      <div class="action-cluster">
        <button class="touch-btn btn-punch" id="touch-punch" data-key="KeyJ">
          <span style="font-size:12px; font-weight:900;">PUNCH</span>
          <span style="font-size:8px; opacity:0.8;">[J] Light</span>
        </button>
        <button class="touch-btn btn-kick" id="touch-kick" data-key="KeyK">
          <span style="font-size:12px; font-weight:900;">KICK</span>
          <span style="font-size:8px; opacity:0.8;">[K] Heavy</span>
        </button>
        <button class="touch-btn btn-block" id="touch-guard" data-key="KeyS" style="grid-column: span 2;">
          <span style="font-size:11px; font-weight:800;">GUARD / CROUCH</span>
          <span style="font-size:8px; opacity:0.8;">-80% Damage Shield</span>
        </button>
      </div>
    </div>
  </div>

  <div id="toast">Code copied to clipboard!</div>

  <!-- Complete Standalone Game Engine Script -->
  <script>
    (function () {
      "use strict";

      // -------------------------------------------------------------
      // 1. SOUND SYNTHESIS ENGINE (Web Audio API - Zero External Assets)
      // -------------------------------------------------------------
      let audioCtx = null;
      let soundEnabled = true;

      function initAudio() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume();
        }
      }

      function playSound(type) {
        if (!soundEnabled) return;
        try {
          initAudio();
          if (!audioCtx) return;
          const t = audioCtx.currentTime;

          if (type === "swoosh_light") {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(360, t);
            osc.frequency.exponentialRampToValueAtTime(140, t + 0.12);
            gain.gain.setValueAtTime(0.2, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.12);
          } else if (type === "swoosh_heavy") {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(260, t);
            osc.frequency.exponentialRampToValueAtTime(90, t + 0.2);
            gain.gain.setValueAtTime(0.3, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.2);
          } else if (type === "hit_light") {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "square";
            osc.frequency.setValueAtTime(120, t);
            osc.frequency.exponentialRampToValueAtTime(40, t + 0.1);
            gain.gain.setValueAtTime(0.4, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.1);
          } else if (type === "hit_heavy") {
            // Punchy bass impact + click
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(160, t);
            osc.frequency.exponentialRampToValueAtTime(30, t + 0.22);
            gain.gain.setValueAtTime(0.5, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.22);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.22);
          } else if (type === "block") {
            // Metallic shield deflection ping
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc1.type = "triangle";
            osc2.type = "sine";
            osc1.frequency.setValueAtTime(840, t);
            osc2.frequency.setValueAtTime(1320, t);
            gain.gain.setValueAtTime(0.35, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(audioCtx.destination);
            osc1.start(t);
            osc2.start(t);
            osc1.stop(t + 0.15);
            osc2.stop(t + 0.15);
          } else if (type === "jump") {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(140, t);
            osc.frequency.exponentialRampToValueAtTime(320, t + 0.15);
            gain.gain.setValueAtTime(0.18, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.15);
          } else if (type === "fight_start") {
            // Retro chime
            [300, 450, 600].forEach((freq, idx) => {
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.type = "triangle";
              osc.frequency.setValueAtTime(freq, t + idx * 0.12);
              gain.gain.setValueAtTime(0.3, t + idx * 0.12);
              gain.gain.exponentialRampToValueAtTime(0.01, t + idx * 0.12 + 0.3);
              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.start(t + idx * 0.12);
              osc.stop(t + idx * 0.12 + 0.35);
            });
          } else if (type === "ko") {
            // Heavy dramatic gong drop
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(180, t);
            osc.frequency.exponentialRampToValueAtTime(25, t + 0.8);
            gain.gain.setValueAtTime(0.6, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.8);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.8);
          }
        } catch (e) {
          // Audio autoplay policy fallback
        }
      }

      // -------------------------------------------------------------
      // 2. CONSTANTS & GAME RESOLUTION SETUP
      // -------------------------------------------------------------
      const CANVAS_WIDTH = 800;
      const CANVAS_HEIGHT = 450;
      const GROUND_Y = 385; // Feet contact level
      const GRAVITY = 0.72;
      const MATCH_DURATION = 90; // Seconds

      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      let showHitboxes = false;
      let screenShake = 0;

      // Particle & Floating Text Systems
      let particles = [];
      let floatingTexts = [];

      function addHitSparks(x, y, isBlock, count = 12) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 5 + 2;
          particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1,
            size: Math.random() * 4 + 2,
            life: 1.0,
            decay: Math.random() * 0.05 + 0.04,
            color: isBlock ? "#00d2ff" : (Math.random() > 0.4 ? "#ffb703" : "#ff3366"),
            isBlock: isBlock
          });
        }
      }

      function addFloatingText(x, y, text, color = "#fff", size = 16) {
        floatingTexts.push({
          x: x,
          y: y,
          text: text,
          color: color,
          size: size,
          life: 1.0,
          vy: -1.4
        });
      }

      // -------------------------------------------------------------
      // 3. FIGHTER CLASS DEFINITION
      // -------------------------------------------------------------
      class Fighter {
        constructor(config) {
          this.name = config.name;
          this.isCPU = config.isCPU || false;
          this.themeColor = config.themeColor;
          this.accentColor = config.accentColor;
          this.giColor = config.giColor;
          this.pantsColor = config.pantsColor;

          this.width = 54;
          this.height = 115;
          this.crouchHeight = 70;

          this.reset(config.startX, config.facing);
        }

        reset(startX, facing) {
          this.x = startX;
          this.y = GROUND_Y;
          this.vx = 0;
          this.vy = 0;
          this.facing = facing; // 1 = right, -1 = left

          this.hp = 100;
          this.maxHp = 100;
          this.lagHp = 100; // Trailing health bar drain

          // State Machine: 'IDLE' | 'WALK_FWD' | 'WALK_BACK' | 'JUMP' | 'CROUCH' | 'PUNCH' | 'KICK' | 'HURT' | 'KO'
          this.state = "IDLE";
          this.stateTimer = 0;
          this.isGrounded = true;

          // Attack animation tracking
          this.attackFrame = 0;
          this.hasHit = false;

          // Hit stun & invulnerability
          this.hurtTimer = 0;
          this.knockbackVx = 0;

          // Stats
          this.damageDealt = 0;
          this.hitsLanded = 0;
          this.comboCount = 0;
          this.maxCombo = 0;
          this.attacksBlocked = 0;

          // AI-specific state
          this.aiState = "IDLE"; // 'IDLE' | 'APPROACH' | 'RETREAT_OR_BLOCK' | 'ATTACK'
          this.aiTimer = 0;
          this.aiCooldown = 0;
          this.aiChosenAttack = null;
        }

        getHurtbox() {
          const isCrouching = this.state === "CROUCH";
          const h = isCrouching ? this.crouchHeight : this.height;
          return {
            x: this.x - this.width / 2,
            y: this.y - h,
            w: this.width,
            h: h
          };
        }

        getHitbox() {
          // Dynamic Hitbox generated strictly during active attack frames
          if (this.state === "PUNCH" && this.attackFrame >= 3 && this.attackFrame <= 9) {
            const reach = 55;
            const w = 45;
            const h = 26;
            const startX = this.facing === 1 ? this.x + 8 : this.x - 8 - w;
            const startY = this.y - (this.state === "CROUCH" ? 50 : 86);
            return {
              x: startX,
              y: startY,
              w: w,
              h: h,
              damage: 8,
              type: "PUNCH",
              knockback: 6 * this.facing
            };
          } else if (this.state === "KICK" && this.attackFrame >= 6 && this.attackFrame <= 15) {
            const reach = 80;
            const w = 62;
            const h = 34;
            const startX = this.facing === 1 ? this.x + 12 : this.x - 12 - w;
            const startY = this.y - 72;
            return {
              x: startX,
              y: startY,
              w: w,
              h: h,
              damage: 18,
              type: "KICK",
              knockback: 11 * this.facing
            };
          }
          return null;
        }

        update(opponent, inputKeys) {
          this.stateTimer++;

          // Lag health smooth drain effect
          if (this.lagHp > this.hp) {
            this.lagHp = Math.max(this.hp, this.lagHp - 0.4);
          }

          // KO State
          if (this.hp <= 0) {
            this.state = "KO";
            if (!this.isGrounded) {
              this.vy += GRAVITY;
              this.y += this.vy;
              if (this.y >= GROUND_Y) {
                this.y = GROUND_Y;
                this.vy = 0;
                this.isGrounded = true;
              }
            }
            this.x += this.knockbackVx;
            this.knockbackVx *= 0.85;
            this.clampPosition();
            return;
          }

          // Hurt / Hit Stun State handling
          if (this.hurtTimer > 0) {
            this.hurtTimer--;
            this.state = "HURT";
            this.x += this.knockbackVx;
            this.knockbackVx *= 0.82;
            if (this.hurtTimer === 0) {
              this.state = "IDLE";
              this.comboCount = 0;
            }
            this.applyPhysics();
            this.clampPosition();
            return;
          }

          // Attack animation progressions
          if (this.state === "PUNCH") {
            this.attackFrame++;
            if (this.attackFrame > 14) {
              this.state = "IDLE";
              this.attackFrame = 0;
            }
          } else if (this.state === "KICK") {
            this.attackFrame++;
            if (this.attackFrame > 22) {
              this.state = "IDLE";
              this.attackFrame = 0;
            }
          }

          // If not in locked attack animation, process AI or Player input
          if (this.state !== "PUNCH" && this.state !== "KICK") {
            if (this.isCPU) {
              this.updateCPU(opponent);
            } else {
              this.updatePlayer(opponent, inputKeys);
            }
          }

          this.applyPhysics();
          this.clampPosition();
        }

        applyPhysics() {
          // Gravity & jumping
          if (!this.isGrounded) {
            this.vy += GRAVITY;
            this.y += this.vy;
            if (this.y >= GROUND_Y) {
              this.y = GROUND_Y;
              this.vy = 0;
              this.isGrounded = true;
              if (this.state === "JUMP") {
                this.state = "IDLE";
              }
            }
          }

          this.x += this.vx;
          this.vx *= 0.75; // Ground friction
        }

        clampPosition() {
          const halfW = this.width / 2;
          if (this.x - halfW < 30) this.x = 30 + halfW;
          if (this.x + halfW > CANVAS_WIDTH - 30) this.x = CANVAS_WIDTH - 30 - halfW;
        }

        // --- PLAYER 1 INPUT LOGIC ---
        updatePlayer(opponent, keys) {
          // Auto face opponent when not attacking
          if (this.isGrounded) {
            this.facing = opponent.x > this.x ? 1 : -1;
          }

          const moveLeft = keys["KeyA"] || keys["ArrowLeft"];
          const moveRight = keys["KeyD"] || keys["ArrowRight"];
          const jump = keys["KeyW"] || keys["ArrowUp"];
          const crouch = keys["KeyS"] || keys["ArrowDown"];
          const punch = keys["KeyJ"] || keys["Digit1"] || keys["KeyZ"];
          const kick = keys["KeyK"] || keys["Digit2"] || keys["KeyX"];

          // Attacks
          if (punch) {
            this.executePunch();
            return;
          }
          if (kick) {
            this.executeKick();
            return;
          }

          // Crouch & Block
          if (crouch && this.isGrounded) {
            this.state = "CROUCH";
            this.vx = 0;
            return;
          }

          // Jump
          if (jump && this.isGrounded) {
            this.vy = -14.5;
            this.isGrounded = false;
            this.state = "JUMP";
            playSound("jump");
            return;
          }

          // Movement
          const moveSpeed = 4.2;
          if (moveLeft) {
            this.vx = -moveSpeed;
            if (this.isGrounded) {
              this.state = this.facing === -1 ? "WALK_FWD" : "WALK_BACK";
            }
          } else if (moveRight) {
            this.vx = moveSpeed;
            if (this.isGrounded) {
              this.state = this.facing === 1 ? "WALK_FWD" : "WALK_BACK";
            }
          } else if (this.isGrounded) {
            this.state = "IDLE";
          }
        }

        // --- CPU AI FINITE STATE MACHINE (FSM) ---
        updateCPU(opponent) {
          if (this.isGrounded) {
            this.facing = opponent.x > this.x ? 1 : -1;
          }

          const dist = Math.abs(this.x - opponent.x);
          const opponentAttacking = (opponent.state === "PUNCH" || opponent.state === "KICK") && dist < 120;

          if (this.aiCooldown > 0) this.aiCooldown--;
          if (this.aiTimer > 0) this.aiTimer--;

          // FSM Decision Trigger
          if (this.aiTimer <= 0) {
            // a) RETREAT / BLOCK: If player is actively attacking close by
            if (opponentAttacking && Math.random() < 0.72) {
              this.aiState = "RETREAT_OR_BLOCK";
              this.aiTimer = 16 + Math.floor(Math.random() * 18);
            }
            // b) ATTACK: Close proximity
            else if (dist < 85 && this.aiCooldown <= 0) {
              this.aiState = "ATTACK";
              this.aiChosenAttack = Math.random() < 0.55 ? "PUNCH" : "KICK";
              this.aiTimer = 8;
            } else if (dist < 115 && this.aiCooldown <= 0 && Math.random() < 0.6) {
              this.aiState = "ATTACK";
              this.aiChosenAttack = "KICK";
              this.aiTimer = 8;
            }
            // c) APPROACH: Out of range
            else if (dist > 95) {
              this.aiState = "APPROACH";
              this.aiTimer = 20 + Math.floor(Math.random() * 25);
            }
            // d) IDLE: Brief natural human pacing pause
            else {
              this.aiState = "IDLE";
              this.aiTimer = 10 + Math.floor(Math.random() * 15);
            }
          }

          // Execute FSM Behavior
          const walkSpeed = 3.6;
          switch (this.aiState) {
            case "APPROACH":
              // Move towards player
              this.vx = (this.facing === 1 ? 1 : -1) * walkSpeed;
              if (this.isGrounded) this.state = "WALK_FWD";
              // Occasional jump in if player is far
              if (dist > 220 && Math.random() < 0.03 && this.isGrounded) {
                this.vy = -14.0;
                this.isGrounded = false;
                this.state = "JUMP";
                playSound("jump");
              }
              break;

            case "RETREAT_OR_BLOCK":
              // 65% Crouch-Block, 35% Step Back
              if (Math.random() < 0.65) {
                this.state = "CROUCH";
                this.vx = 0;
              } else {
                this.vx = (this.facing === 1 ? -1 : 1) * (walkSpeed * 0.9);
                if (this.isGrounded) this.state = "WALK_BACK";
              }
              break;

            case "ATTACK":
              if (this.aiChosenAttack === "PUNCH") {
                this.executePunch();
              } else {
                this.executeKick();
              }
              this.aiCooldown = 28 + Math.floor(Math.random() * 32); // Reaction buffer
              this.aiState = "IDLE";
              this.aiTimer = 18;
              break;

            case "IDLE":
            default:
              this.vx = 0;
              if (this.isGrounded) this.state = "IDLE";
              break;
          }
        }

        executePunch() {
          if (this.state === "PUNCH" || this.state === "KICK") return;
          this.state = "PUNCH";
          this.attackFrame = 0;
          this.hasHit = false;
          playSound("swoosh_light");
        }

        executeKick() {
          if (this.state === "PUNCH" || this.state === "KICK") return;
          this.state = "KICK";
          this.attackFrame = 0;
          this.hasHit = false;
          playSound("swoosh_heavy");
        }

        takeHit(hitbox, attacker) {
          const isBlocking = this.state === "CROUCH";
          let actualDmg = hitbox.damage;

          if (isBlocking) {
            // Block reduces damage by 80%
            actualDmg = Math.max(1, Math.round(hitbox.damage * 0.2));
            this.hp = Math.max(0, this.hp - actualDmg);
            this.attacksBlocked++;
            playSound("block");
            addHitSparks(this.x, this.y - 50, true, 8);
            addFloatingText(this.x, this.y - 75, `BLOCKED! -${actualDmg}`, "#00d2ff", 14);
            // Minor pushback on block
            this.x += hitbox.knockback * 0.35;
          } else {
            // Full damage hit
            this.hp = Math.max(0, this.hp - actualDmg);
            this.hurtTimer = hitbox.type === "KICK" ? 22 : 14;
            this.knockbackVx = hitbox.knockback;
            this.state = "HURT";
            this.attackFrame = 0; // Interrupt attacker

            attacker.hitsLanded++;
            attacker.damageDealt += actualDmg;
            attacker.comboCount++;
            if (attacker.comboCount > attacker.maxCombo) {
              attacker.maxCombo = attacker.comboCount;
            }

            // Screen shake
            screenShake = hitbox.type === "KICK" ? 7 : 4;

            playSound(hitbox.type === "KICK" ? "hit_heavy" : "hit_light");
            addHitSparks(hitbox.x + hitbox.w / 2, hitbox.y + hitbox.h / 2, false, hitbox.type === "KICK" ? 18 : 10);

            const comboStr = attacker.comboCount > 1 ? ` · ${attacker.comboCount} HITS!` : "";
            addFloatingText(this.x, this.y - 85, `-${actualDmg}${comboStr}`, "#ff3366", 18);

            if (this.hp <= 0) {
              playSound("ko");
              addFloatingText(CANVAS_WIDTH / 2, 200, "K.O.!", "#ff3366", 48);
            }
          }

          this.clampPosition();
        }

        // --- DIRECT CANVAS PROCEDURAL VECTOR RENDERING ---
        draw(ctx) {
          ctx.save();

          // Fighter drop shadow on the ground
          const shadowScale = Math.max(0.3, 1 - (GROUND_Y - this.y) / 200);
          ctx.beginPath();
          ctx.ellipse(this.x, GROUND_Y + 4, 32 * shadowScale, 9 * shadowScale, 0, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
          ctx.fill();

          ctx.translate(this.x, this.y);
          ctx.scale(this.facing, 1);

          // Stance calculations
          const isCrouching = this.state === "CROUCH";
          const isHurt = this.state === "HURT";
          const isPunching = this.state === "PUNCH";
          const isKicking = this.state === "KICK";
          const isWalking = this.state === "WALK_FWD" || this.state === "WALK_BACK";
          const isKO = this.state === "KO";

          // Idle breathing bob
          const bob = (!isCrouching && !isHurt && !isKO) ? Math.sin(this.stateTimer * 0.12) * 2 : 0;
          const walkCycle = isWalking ? Math.sin(this.stateTimer * 0.28) : 0;

          if (isKO) {
            // KO fallen pose
            ctx.rotate(Math.PI / 2);
            ctx.translate(-20, -50);
          }

          // Hurt Red Flash effect
          if (isHurt && Math.floor(this.stateTimer / 2) % 2 === 0) {
            ctx.fillStyle = "#ff3366";
            ctx.shadowColor = "#ff3366";
            ctx.shadowBlur = 15;
          }

          // Height offset for crouch
          const crouchOffset = isCrouching ? 40 : 0;

          // 1. LEGS & PANTS
          ctx.fillStyle = this.pantsColor;
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 2.5;

          if (isKicking && this.attackFrame >= 5 && this.attackFrame <= 16) {
            // Extended Roundhouse Kick Leg
            ctx.save();
            ctx.translate(0, -60);
            ctx.rotate(0.1);
            // Kicking Leg
            ctx.beginPath();
            ctx.roundRect(10, -10, 75, 20, 8);
            ctx.fill();
            ctx.stroke();
            // Foot wrap
            ctx.fillStyle = "#ffb703";
            ctx.beginPath();
            ctx.roundRect(75, -12, 18, 24, 4);
            ctx.fill();
            ctx.stroke();

            // Kick Wind Effect arc
            ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, 95, -0.4, 0.5);
            ctx.stroke();
            ctx.restore();

            // Supporting back leg
            ctx.fillStyle = this.pantsColor;
            ctx.beginPath();
            ctx.roundRect(-16, -55, 24, 55, 6);
            ctx.fill();
            ctx.stroke();
          } else if (isCrouching) {
            // Low crouching bent legs
            ctx.beginPath();
            ctx.roundRect(-24, -36, 26, 36, 6);
            ctx.roundRect(2, -36, 26, 36, 6);
            ctx.fill();
            ctx.stroke();
          } else {
            // Standing / Walking legs
            const leg1Angle = walkCycle * 0.35;
            const leg2Angle = -walkCycle * 0.35;

            // Back leg
            ctx.save();
            ctx.translate(10, -55 + bob);
            ctx.rotate(leg2Angle);
            ctx.beginPath();
            ctx.roundRect(-10, 0, 20, 55, 5);
            ctx.fill();
            ctx.stroke();
            // Foot
            ctx.fillStyle = "#e2e8f0";
            ctx.fillRect(-8, 50, 22, 7);
            ctx.restore();

            // Front leg
            ctx.save();
            ctx.fillStyle = this.pantsColor;
            ctx.translate(-10, -55 + bob);
            ctx.rotate(leg1Angle);
            ctx.beginPath();
            ctx.roundRect(-10, 0, 20, 55, 5);
            ctx.fill();
            ctx.stroke();
            // Foot
            ctx.fillStyle = "#e2e8f0";
            ctx.fillRect(-8, 50, 22, 7);
            ctx.restore();
          }

          // 2. TORSO & MARTIAL ARTS GI
          ctx.fillStyle = this.giColor;
          ctx.beginPath();
          const torsoY = isCrouching ? -68 : -98 + bob;
          const torsoH = isCrouching ? 36 : 46;
          ctx.roundRect(-22, torsoY, 44, torsoH, 6);
          ctx.fill();
          ctx.stroke();

          // Black/White Belt
          ctx.fillStyle = this.isCPU ? "#111" : "#fff";
          ctx.fillRect(-22, torsoY + torsoH - 10, 44, 9);
          // Belt dangling knot
          ctx.beginPath();
          ctx.roundRect(-4, torsoY + torsoH - 2, 8, 16, 2);
          ctx.fill();

          // 3. HEAD & HEADBAND
          const headY = isCrouching ? -90 : -120 + bob;
          // Neck
          ctx.fillStyle = "#f6c29b";
          ctx.fillRect(-8, headY + 16, 16, 12);
          // Face
          ctx.beginPath();
          ctx.arc(0, headY + 8, 14, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Hair & Headband
          ctx.fillStyle = this.accentColor; // Flowing headband color
          ctx.fillRect(-15, headY - 1, 30, 8);

          // Flowing Headband Tails
          const tailFlutter = Math.sin(this.stateTimer * 0.3) * 6;
          ctx.beginPath();
          ctx.moveTo(-14, headY + 2);
          ctx.quadraticCurveTo(-30, headY - 4 + tailFlutter, -42, headY + 6 + tailFlutter);
          ctx.lineWidth = 4.5;
          ctx.strokeStyle = this.accentColor;
          ctx.stroke();

          // Eyes (fierce expression)
          ctx.fillStyle = "#111";
          ctx.beginPath();
          ctx.arc(6, headY + 7, 2, 0, Math.PI * 2);
          ctx.fill();

          // 4. ARMS & ATTACKS
          ctx.fillStyle = this.giColor;
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 2.5;

          if (isPunching) {
            // Snap Punch arm
            const punchProgress = this.attackFrame <= 6 ? this.attackFrame / 6 : (14 - this.attackFrame) / 8;
            const reachX = 14 + punchProgress * 48;

            ctx.save();
            ctx.fillStyle = "#f6c29b";
            ctx.beginPath();
            ctx.roundRect(0, torsoY + 10, reachX, 16, 6);
            ctx.fill();
            ctx.stroke();

            // Boxing Glove / Fist
            ctx.fillStyle = this.accentColor;
            ctx.beginPath();
            ctx.roundRect(reachX - 4, torsoY + 7, 20, 22, 6);
            ctx.fill();
            ctx.stroke();

            // Punch motion lines
            if (this.attackFrame >= 3 && this.attackFrame <= 9) {
              ctx.strokeStyle = "#fff";
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(reachX - 10, torsoY + 12);
              ctx.lineTo(reachX + 28, torsoY + 12);
              ctx.moveTo(reachX - 6, torsoY + 24);
              ctx.lineTo(reachX + 22, torsoY + 24);
              ctx.stroke();
            }
            ctx.restore();
          } else if (isCrouching) {
            // Blocking crossed guard arms
            ctx.save();
            ctx.fillStyle = "#f6c29b";
            ctx.beginPath();
            ctx.roundRect(4, torsoY + 4, 16, 32, 6);
            ctx.fill();
            ctx.stroke();
            // Glove
            ctx.fillStyle = this.accentColor;
            ctx.beginPath();
            ctx.roundRect(6, torsoY - 4, 18, 18, 4);
            ctx.fill();
            ctx.stroke();

            // Defense Shimmer Shield
            ctx.strokeStyle = this.themeColor;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(20, torsoY + 14, 28, -Math.PI * 0.45, Math.PI * 0.45);
            ctx.stroke();
            ctx.restore();
          } else {
            // Guard Arms (Idle / Walking)
            ctx.save();
            ctx.fillStyle = "#f6c29b";
            ctx.beginPath();
            ctx.roundRect(4, torsoY + 12, 14, 26, 6);
            ctx.fill();
            ctx.stroke();
            // Fist
            ctx.fillStyle = this.accentColor;
            ctx.beginPath();
            ctx.roundRect(8, torsoY + 8, 16, 16, 4);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
          }

          ctx.restore();

          // 5. DEBUG HITBOX & HURTBOX VISUALIZER (if enabled)
          if (showHitboxes) {
            const hurt = this.getHurtbox();
            ctx.strokeStyle = "rgba(0, 255, 120, 0.85)";
            ctx.lineWidth = 2;
            ctx.strokeRect(hurt.x, hurt.y, hurt.w, hurt.h);
            ctx.fillStyle = "rgba(0, 255, 120, 0.15)";
            ctx.fillRect(hurt.x, hurt.y, hurt.w, hurt.h);

            const hit = this.getHitbox();
            if (hit) {
              ctx.strokeStyle = "rgba(255, 40, 40, 0.95)";
              ctx.lineWidth = 2.5;
              ctx.strokeRect(hit.x, hit.y, hit.w, hit.h);
              ctx.fillStyle = "rgba(255, 40, 40, 0.35)";
              ctx.fillRect(hit.x, hit.y, hit.w, hit.h);
            }
          }
        }
      }

      // -------------------------------------------------------------
      // 4. GAME ENGINE & MATCH STATE
      // -------------------------------------------------------------
      const p1 = new Fighter({
        name: "RYU (P1)",
        isCPU: false,
        startX: 220,
        facing: 1,
        themeColor: "#00d2ff",
        accentColor: "#ff3366",
        giColor: "#f0f4f8",
        pantsColor: "#223555"
      });

      const cpu = new Fighter({
        name: "KEN (CPU)",
        isCPU: true,
        startX: 580,
        facing: -1,
        themeColor: "#ff3366",
        accentColor: "#ffb703",
        giColor: "#be123c",
        pantsColor: "#1e1b2e"
      });

      let matchTimer = MATCH_DURATION;
      let lastTime = performance.now();
      let timerAccumulator = 0;
      let matchState = "FIGHT"; // 'INTRO' | 'FIGHT' | 'GAME_OVER'
      let introTimer = 75; // ~1.2s "ROUND 1 - FIGHT!" splash

      const keysDown = {};

      // -------------------------------------------------------------
      // 5. BACKGROUND & STAGE RENDERING
      // -------------------------------------------------------------
      function drawStage() {
        // Sky Gradient (Sunset Twilight over Tokyo)
        const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
        skyGrad.addColorStop(0, "#0b0d1e");
        skyGrad.addColorStop(0.4, "#2a1538");
        skyGrad.addColorStop(0.7, "#802244");
        skyGrad.addColorStop(0.95, "#df6d38");
        skyGrad.addColorStop(1, "#f4a261");
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        // Distant Glowing Sun / Moon
        const sunGrad = ctx.createRadialGradient(400, 180, 10, 400, 180, 110);
        sunGrad.addColorStop(0, "rgba(255, 235, 150, 0.9)");
        sunGrad.addColorStop(0.3, "rgba(255, 120, 60, 0.4)");
        sunGrad.addColorStop(1, "rgba(255, 60, 80, 0)");
        ctx.fillStyle = sunGrad;
        ctx.beginPath();
        ctx.arc(400, 180, 110, 0, Math.PI * 2);
        ctx.fill();

        // Distant Mountains & Pagoda Skyline Silhouette
        ctx.fillStyle = "rgba(18, 14, 32, 0.75)";
        ctx.beginPath();
        ctx.moveTo(0, 270);
        ctx.lineTo(80, 240);
        ctx.lineTo(160, 260);
        ctx.lineTo(240, 230);
        ctx.lineTo(310, 250);
        // Center Pagoda
        ctx.lineTo(370, 250);
        ctx.lineTo(370, 200);
        ctx.lineTo(360, 200);
        ctx.lineTo(400, 160);
        ctx.lineTo(440, 200);
        ctx.lineTo(430, 200);
        ctx.lineTo(430, 250);
        ctx.lineTo(520, 230);
        ctx.lineTo(620, 260);
        ctx.lineTo(720, 225);
        ctx.lineTo(800, 250);
        ctx.lineTo(800, GROUND_Y);
        ctx.lineTo(0, GROUND_Y);
        ctx.fill();

        // City Skyscrapers & Neon Window Lights
        ctx.fillStyle = "rgba(14, 16, 28, 0.95)";
        const buildings = [
          [20, 180, 60], [90, 150, 50], [150, 190, 55], [215, 160, 70],
          [510, 170, 65], [585, 140, 55], [650, 185, 60], [720, 160, 65]
        ];
        buildings.forEach(([bx, by, bw]) => {
          ctx.fillRect(bx, by, bw, GROUND_Y - by);
          // Random illuminated windows
          ctx.fillStyle = "rgba(255, 235, 120, 0.75)";
          for (let wy = by + 12; wy < GROUND_Y - 40; wy += 14) {
            for (let wx = bx + 6; wx < bx + bw - 8; wx += 10) {
              if ((wx * wy) % 7 > 2) {
                ctx.fillRect(wx, wy, 4, 6);
              }
            }
          }
          ctx.fillStyle = "rgba(14, 16, 28, 0.95)";
        });

        // Stage Floor / Rooftop Tiles
        const floorGrad = ctx.createLinearGradient(0, GROUND_Y, 0, CANVAS_HEIGHT);
        floorGrad.addColorStop(0, "#2b2d42");
        floorGrad.addColorStop(0.2, "#1d1f2e");
        floorGrad.addColorStop(1, "#0d0e17");
        ctx.fillStyle = floorGrad;
        ctx.fillRect(0, GROUND_Y, CANVAS_WIDTH, CANVAS_HEIGHT - GROUND_Y);

        // Floor Rim highlight
        ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        ctx.lineTo(CANVAS_WIDTH, GROUND_Y);
        ctx.stroke();

        // Perspective tile grid lines
        ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
        ctx.lineWidth = 1.5;
        for (let x = -200; x < CANVAS_WIDTH + 200; x += 60) {
          ctx.beginPath();
          ctx.moveTo(x, GROUND_Y);
          ctx.lineTo(x + (x - CANVAS_WIDTH / 2) * 0.8, CANVAS_HEIGHT);
          ctx.stroke();
        }

        // Japanese Torii Gate Pillars on the sides
        ctx.fillStyle = "#801b2a";
        ctx.fillRect(12, 110, 18, GROUND_Y - 110);
        ctx.fillRect(CANVAS_WIDTH - 30, 110, 18, GROUND_Y - 110);
        // Crossbeams
        ctx.fillRect(0, 130, 50, 12);
        ctx.fillRect(CANVAS_WIDTH - 50, 130, 50, 12);
        // Glowing paper lanterns
        ctx.fillStyle = "rgba(255, 80, 50, 0.85)";
        ctx.beginPath();
        ctx.arc(38, 160, 10, 0, Math.PI * 2);
        ctx.arc(CANVAS_WIDTH - 38, 160, 10, 0, Math.PI * 2);
        ctx.fill();
      }

      // -------------------------------------------------------------
      // 6. HUD & HEALTH BAR RENDERING
      // -------------------------------------------------------------
      function drawHUD() {
        const barWidth = 310;
        const barHeight = 22;
        const topY = 24;

        // --- PLAYER 1 HEALTH (Left to Right) ---
        // Container
        ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
        ctx.fillRect(20, topY, barWidth, barHeight);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
        ctx.lineWidth = 2;
        ctx.strokeRect(20, topY, barWidth, barHeight);

        // Trailing Lag Bar (Yellow)
        const p1LagW = (p1.lagHp / p1.maxHp) * barWidth;
        ctx.fillStyle = "#ffb703";
        ctx.fillRect(20 + barWidth - p1LagW, topY, p1LagW, barHeight);

        // Current HP Bar (Cyan/Green Gradient)
        const p1CurW = (p1.hp / p1.maxHp) * barWidth;
        const p1Grad = ctx.createLinearGradient(20, 0, 20 + barWidth, 0);
        p1Grad.addColorStop(0, "#00d2ff");
        p1Grad.addColorStop(1, "#38ef7d");
        ctx.fillStyle = p1Grad;
        ctx.fillRect(20 + barWidth - p1CurW, topY, p1CurW, barHeight);

        // P1 Name Label
        ctx.font = "800 13px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.fillStyle = "#fff";
        ctx.textAlign = "left";
        ctx.fillText("RYU · PLAYER 1", 20, topY - 7);
        ctx.font = "700 11px monospace";
        ctx.fillStyle = "#00d2ff";
        ctx.fillText(`HP: ${Math.round(p1.hp)}/100`, 20, topY + barHeight + 15);

        // --- CPU HEALTH (Right to Left) ---
        // Container
        const cpuStartX = CANVAS_WIDTH - 20 - barWidth;
        ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
        ctx.fillRect(cpuStartX, topY, barWidth, barHeight);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
        ctx.lineWidth = 2;
        ctx.strokeRect(cpuStartX, topY, barWidth, barHeight);

        // Trailing Lag Bar
        const cpuLagW = (cpu.lagHp / cpu.maxHp) * barWidth;
        ctx.fillStyle = "#ffb703";
        ctx.fillRect(cpuStartX, topY, cpuLagW, barHeight);

        // Current HP Bar (Red Gradient)
        const cpuCurW = (cpu.hp / cpu.maxHp) * barWidth;
        const cpuGrad = ctx.createLinearGradient(cpuStartX, 0, cpuStartX + barWidth, 0);
        cpuGrad.addColorStop(0, "#ff5e3a");
        cpuGrad.addColorStop(1, "#ff3366");
        ctx.fillStyle = cpuGrad;
        ctx.fillRect(cpuStartX, topY, cpuCurW, barHeight);

        // CPU Name Label
        ctx.font = "800 13px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.fillStyle = "#fff";
        ctx.textAlign = "right";
        ctx.fillText("KEN · CPU (AI)", CANVAS_WIDTH - 20, topY - 7);
        ctx.font = "700 11px monospace";
        ctx.fillStyle = "#ff3366";
        ctx.fillText(`HP: ${Math.round(cpu.hp)}/100`, CANVAS_WIDTH - 20, topY + barHeight + 15);

        // --- ROUND TIMER (Center Hexagon/Pill) ---
        const timerX = CANVAS_WIDTH / 2;
        const timerY = topY + barHeight / 2;

        ctx.fillStyle = "#0e111a";
        ctx.beginPath();
        ctx.arc(timerX, timerY, 28, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = matchTimer <= 15 ? "#ff3366" : "#ffb703";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = matchTimer <= 15 ? "#ff3366" : "#ffffff";
        ctx.font = "900 24px monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(Math.ceil(matchTimer), timerX, timerY);

        ctx.font = "800 11px sans-serif";
        ctx.fillStyle = "#8b9bb4";
        ctx.fillText("ROUND 1", timerX, timerY + 40);

        // --- INTRO "ROUND 1 - FIGHT!" SPLASH ---
        if (introTimer > 0) {
          introTimer--;
          ctx.save();
          ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
          ctx.fillRect(0, 160, CANVAS_WIDTH, 110);

          ctx.font = "900 48px -apple-system, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";

          if (introTimer > 30) {
            ctx.fillStyle = "#ffb703";
            ctx.shadowColor = "#ffb703";
            ctx.shadowBlur = 20;
            ctx.fillText("ROUND 1", CANVAS_WIDTH / 2, 215);
          } else {
            ctx.fillStyle = "#ff3366";
            ctx.shadowColor = "#ff3366";
            ctx.shadowBlur = 30;
            ctx.fillText("FIGHT!", CANVAS_WIDTH / 2, 215);
          }
          ctx.restore();
        }
      }

      // -------------------------------------------------------------
      // 7. PARTICLES & FLOATING TEXTS
      // -------------------------------------------------------------
      function updateAndDrawParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.2; // Gravity
          p.life -= p.decay;

          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        for (let i = floatingTexts.length - 1; i >= 0; i--) {
          const ft = floatingTexts[i];
          ft.y += ft.vy;
          ft.life -= 0.025;

          if (ft.life <= 0) {
            floatingTexts.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = ft.life;
          ctx.font = `900 ${ft.size}px -apple-system, sans-serif`;
          ctx.fillStyle = ft.color;
          ctx.textAlign = "center";
          ctx.shadowColor = "#000";
          ctx.shadowBlur = 6;
          ctx.fillText(ft.text, ft.x, ft.y);
          ctx.restore();
        }
      }

      // -------------------------------------------------------------
      // 8. COLLISION DETECTION (AABB Overlap)
      // -------------------------------------------------------------
      function checkCollisions() {
        if (matchState !== "FIGHT") return;

        // Player 1 Hitbox vs CPU Hurtbox
        const p1Hit = p1.getHitbox();
        if (p1Hit && !p1.hasHit) {
          const cpuHurt = cpu.getHurtbox();
          if (
            p1Hit.x < cpuHurt.x + cpuHurt.w &&
            p1Hit.x + p1Hit.w > cpuHurt.x &&
            p1Hit.y < cpuHurt.y + cpuHurt.h &&
            p1Hit.y + p1Hit.h > cpuHurt.y
          ) {
            p1.hasHit = true;
            cpu.takeHit(p1Hit, p1);
          }
        }

        // CPU Hitbox vs Player 1 Hurtbox
        const cpuHit = cpu.getHitbox();
        if (cpuHit && !cpu.hasHit) {
          const p1Hurt = p1.getHurtbox();
          if (
            cpuHit.x < p1Hurt.x + p1Hurt.w &&
            cpuHit.x + cpuHit.w > p1Hurt.x &&
            cpuHit.y < p1Hurt.y + p1Hurt.h &&
            cpuHit.y + cpuHit.h > p1Hurt.y
          ) {
            cpu.hasHit = true;
            p1.takeHit(cpuHit, cpu);
          }
        }
      }

      // -------------------------------------------------------------
      // 9. MATCH OVER EVALUATION
      // -------------------------------------------------------------
      const gameOverOverlay = document.getElementById("game-over-overlay");
      const resultBadge = document.getElementById("result-badge");
      const resultSubtitle = document.getElementById("result-subtitle");

      function checkMatchOver() {
        if (matchState === "GAME_OVER") return;

        let isOver = false;
        let winner = null;

        if (p1.hp <= 0 && cpu.hp <= 0) {
          isOver = true;
          winner = "DRAW";
        } else if (p1.hp <= 0) {
          isOver = true;
          winner = "CPU";
        } else if (cpu.hp <= 0) {
          isOver = true;
          winner = "PLAYER 1";
        } else if (matchTimer <= 0) {
          isOver = true;
          if (p1.hp > cpu.hp) winner = "PLAYER 1";
          else if (cpu.hp > p1.hp) winner = "CPU";
          else winner = "DRAW";
        }

        if (isOver) {
          matchState = "GAME_OVER";
          setTimeout(() => {
            showGameOverModal(winner);
          }, 800);
        }
      }

      function showGameOverModal(winner) {
        resultBadge.className = "match-result-title";

        if (winner === "PLAYER 1") {
          resultBadge.textContent = "PLAYER 1 WINS";
          resultBadge.classList.add("p1-win");
          resultSubtitle.textContent = p1.hp === 100 ? "FLAWLESS VICTORY!" : "K.O. CHAMPION";
        } else if (winner === "CPU") {
          resultBadge.textContent = "CPU WINS";
          resultBadge.classList.add("cpu-win");
          resultSubtitle.textContent = "DEFEAT — TRY AGAIN!";
        } else {
          resultBadge.textContent = "TIME OVER - DRAW";
          resultBadge.classList.add("draw");
          resultSubtitle.textContent = "STALEMATE MATCH";
        }

        document.getElementById("stat-p1-damage").textContent = p1.damageDealt;
        document.getElementById("stat-p1-hits").textContent = p1.hitsLanded;
        document.getElementById("stat-p1-combo").textContent = p1.maxCombo;
        document.getElementById("stat-p1-blocks").textContent = p1.attacksBlocked;

        gameOverOverlay.classList.add("visible");
      }

      function restartMatch() {
        p1.reset(220, 1);
        cpu.reset(580, -1);
        matchTimer = MATCH_DURATION;
        timerAccumulator = 0;
        introTimer = 70;
        matchState = "FIGHT";
        particles = [];
        floatingTexts = [];
        gameOverOverlay.classList.remove("visible");
        playSound("fight_start");
      }

      // -------------------------------------------------------------
      // 10. MAIN ANIMATION & GAME LOOP
      // -------------------------------------------------------------
      function gameLoop(now) {
        const delta = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;

        // Match Timer countdown
        if (matchState === "FIGHT" && introTimer <= 0) {
          timerAccumulator += delta;
          if (timerAccumulator >= 1.0) {
            matchTimer = Math.max(0, matchTimer - 1);
            timerAccumulator -= 1.0;
          }
        }

        // Logic Updates
        p1.update(cpu, keysDown);
        cpu.update(p1, keysDown);
        checkCollisions();
        checkMatchOver();

        // Screen Shake calculation
        let shakeX = 0;
        let shakeY = 0;
        if (screenShake > 0) {
          shakeX = (Math.random() - 0.5) * screenShake;
          shakeY = (Math.random() - 0.5) * screenShake;
          screenShake *= 0.8;
          if (screenShake < 0.3) screenShake = 0;
        }

        // Render Frame
        ctx.save();
        ctx.translate(shakeX, shakeY);

        drawStage();
        p1.draw(ctx);
        cpu.draw(ctx);
        updateAndDrawParticles();
        drawHUD();

        ctx.restore();

        requestAnimationFrame(gameLoop);
      }

      // -------------------------------------------------------------
      // 11. KEYBOARD & MOBILE TOUCH CONTROLS
      // -------------------------------------------------------------
      window.addEventListener("keydown", (e) => {
        initAudio();
        // Prevent page scrolling on arrow keys and space
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) {
          e.preventDefault();
        }

        keysDown[e.code] = true;

        // Hitbox visualizer toggle
        if (e.code === "KeyH") {
          toggleHitboxDisplay();
        }

        // Space or Enter to restart when game over
        if ((e.code === "Space" || e.code === "Enter") && matchState === "GAME_OVER") {
          restartMatch();
        }
      });

      window.addEventListener("keyup", (e) => {
        keysDown[e.code] = false;
      });

      // Mobile Touch Button Handlers
      function setupTouchControls() {
        const touchBtns = document.querySelectorAll(".touch-btn");

        touchBtns.forEach((btn) => {
          const keyCode = btn.getAttribute("data-key");
          if (!keyCode) return;

          const press = (e) => {
            e.preventDefault();
            initAudio();
            keysDown[keyCode] = true;
            btn.classList.add("pressed");
          };

          const release = (e) => {
            e.preventDefault();
            keysDown[keyCode] = false;
            btn.classList.remove("pressed");
          };

          btn.addEventListener("touchstart", press, { passive: false });
          btn.addEventListener("touchend", release, { passive: false });
          btn.addEventListener("touchcancel", release, { passive: false });

          // Mouse fallbacks for desktop testing
          btn.addEventListener("mousedown", press);
          btn.addEventListener("mouseup", release);
          btn.addEventListener("mouseleave", release);
        });
      }

      // -------------------------------------------------------------
      // 12. UI BUTTON INTERACTIONS & UTILITIES
      // -------------------------------------------------------------
      function toggleHitboxDisplay() {
        showHitboxes = !showHitboxes;
        const btn = document.getElementById("toggle-hitboxes");
        const status = document.getElementById("hitbox-status");
        if (btn && status) {
          if (showHitboxes) {
            btn.classList.add("active");
            status.textContent = "ON";
            status.style.color = "#00d2ff";
          } else {
            btn.classList.remove("active");
            status.textContent = "OFF";
            status.style.color = "#8b9bb4";
          }
        }
      }

      document.getElementById("toggle-hitboxes").addEventListener("click", () => {
        toggleHitboxDisplay();
      });

      document.getElementById("toggle-sound").addEventListener("click", () => {
        initAudio();
        soundEnabled = !soundEnabled;
        const status = document.getElementById("sound-status");
        if (soundEnabled) {
          status.textContent = "FX ON";
          playSound("fight_start");
        } else {
          status.textContent = "MUTED";
        }
      });

      document.getElementById("btn-restart").addEventListener("click", () => {
        initAudio();
        restartMatch();
      });

      // Copy Standalone HTML Utility
      document.getElementById("copy-html-btn").addEventListener("click", () => {
        const fullHTML = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
        navigator.clipboard.writeText(fullHTML).then(() => {
          const toast = document.getElementById("toast");
          toast.classList.add("show");
          setTimeout(() => {
            toast.classList.remove("show");
          }, 2400);
        });
      });

      // Start engine
      setupTouchControls();
      playSound("fight_start");
      requestAnimationFrame(gameLoop);
    })();
  </script>
</body>
</html>
